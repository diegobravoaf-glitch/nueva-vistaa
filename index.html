<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lector QR Secuencial Móvil</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 15px;
            text-align: center;
            background-color: #f8f9fa;
            color: #212529;
        }
        .hidden {
            display: none !important;
        }
        
        /* Estilos de tu formulario de Login integrado */
        .login-card {
            background: #fff;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-top: 50px;
            box-sizing: border-box;
        }
        .login-card h2 {
            margin-top: 0;
            color: #212529;
        }
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9em;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1em;
        }
        #mensaje-error {
            color: #dc3545;
            font-weight: bold;
            margin-top: 10px;
            font-size: 0.9em;
        }

        /* Tus estilos originales del escáner */
        #camara-contenedor {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            margin: 15px auto;
            border: 3px solid #0d6efd;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .info-secuencia {
            font-size: 1.3rem;
            margin: 10px 0;
            font-weight: bold;
        }
        #numero-esperado {
            color: #0d6efd;
            font-size: 1.8rem;
        }
        .controles {
            margin: 15px 0;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button.btn-peligro { background-color: #dc3545; }
        select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #dee2e6;
            text-align: center;
        }
        th { background-color: #212529; color: white; }
        .valido { color: #198754; font-weight: bold; }
        .invalido { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- PANTALLA 1: FORMULARIO DE LOGIN            -->
    <!-- ========================================== -->
    <div id="pantalla-login" class="login-card">
        <h2>🔒 Acceso al Sistema</h2>
        <p style="color: #666; font-size: 0.9em; margin-bottom: 20px;">Por favor ingresa tus credenciales de ronda.</p>
        
        <div class="form-group">
            <label>Usuario</label>
            <input type="text" id="user" placeholder="Escribe tu usuario" autocomplete="off" autocapitalize="off" autocorrect="off">
        </div>
        
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="pass" placeholder="Escribe tu contraseña" autocomplete="off" autocapitalize="off" autocorrect="off">
        </div>
        
        <button type="button" onclick="validarLoginNativo()">Entrar al Escáner</button>
        
        <div id="mensaje-error"></div>
    </div>


    <!-- ========================================== -->
    <!-- PANTALLA 2: TU ESCÁNER ORIGINAL DE RONDAS  -->
    <!-- ========================================== -->
    <div id="aplicativo-escaner" class="hidden">
        <p>Escáner QR en Tiempo Real</p>
        <h1 style="margin: 5px 0;">Lector QR Secuencial</h1>
        
        <p style="margin: 0; font-size: 0.9em; color: #666;">Operador: DIEGO • <a href="#" onclick="cerrarSesionApp(); return false;" style="color: #dc3545; font-weight: bold; text-decoration: none;">Salir</a></p>
        
        <div class="info-secuencia" style="margin-top: 15px;">
            Siguiente esperado: <span id="numero-esperado">1</span>
        </div>

        <div class="controles">
            <button id="btn-iniciar">Encender Cámara</button>
            <select id="selector-camara" style="display:none;"></select>
        </div>

        <div id="camara-contenedor">
            <video id="video-feed" autoplay playsinline muted></video>
        </div>

        <h2>Historial de Registros</h2>
        <table>
            <thead>
                <tr>
                    <th>Hora</th>
                    <th>QR</th>
                    <th>Resultado</th>
                </tr>
            </thead>
            <tbody id="tabla-historial"></tbody>
        </table>

        <button id="btn-reiniciar" class="btn-peligro" style="margin-top:20px;">Reiniciar Todo</button>
    </div>

    <!-- ========================================== -->
    <!-- LÓGICA JAVASCRIPT INTEGRADA                -->
    <!-- ========================================== -->
    <script>
        // --- CONTROL DEL LOGIN ---
        function validarLoginNativo() {
            const usuario = document.getElementById("user").value.trim().toLowerCase();
            const clave = document.getElementById("pass").value.trim();
            const errorBox = document.getElementById("mensaje-error");

            if (usuario === "diego" && clave === "12345") {
                // Intercambio limpio de vistas
                document.getElementById("pantalla-login").classList.add("hidden");
                document.getElementById("aplicativo-escaner").classList.remove("hidden");
                
                errorBox.innerText = "";
                document.getElementById("user").value = "";
                document.getElementById("pass").value = "";
                
                // Ejecutar automáticamente el reconocimiento de tus cámaras nativas
                obtenerCamaras();
            } else {
                errorBox.innerText = "❌ Datos incorrectos de acceso";
            }
        }

        function cerrarSesionApp() {
            if (flujoActual) {
                flujoActual.getTracks().forEach(track => track.stop());
                btnIniciar.style.display = 'inline-block';
            }
            document.getElementById("aplicativo-escaner").classList.add("hidden");
            document.getElementById("pantalla-login").classList.remove("hidden");
        }


        // --- TU LÓGICA SECUENCIAL NATIVA ORIGINAL ---
        let siguienteEsperado = 1;
        let listaDispositivos = [];
        let flujoActual = null;

        const video = document.getElementById('video-feed');
        const btnIniciar = document.getElementById('btn-iniciar');
        const selectorCamara = document.getElementById('selector-camara');
        const txtEsperado = document.getElementById('numero-esperado');
        const tablaHistorial = document.getElementById('tabla-historial');
        const btnReiniciar = document.getElementById('btn-reiniciar');

        if (!('BarcodeDetector' in window)) {
            alert('Tu navegador no soporta lectura nativa de QR. Asegúrate de usar Chrome, Edge o Safari actualizado y bajo una conexión HTTPS.');
        }

        const detectorCodigos = new BarcodeDetector({ formats: ['qr_code'] });

        async function obtenerCamaras() {
            try {
                const dispositivos = await navigator.mediaDevices.enumerateDevices();
                listaDispositivos = dispositivos.filter(d => d.kind === 'videoinput');
                
                selectorCamara.innerHTML = '';
                listaDispositivos.forEach((dispositivo, index) => {
                    const opcion = document.createElement('option');
                    opcion.value = dispositivo.deviceId;
                    opcion.text = dispositivo.label || `Cámara ${index + 1}`;
                    if (dispositivo.label.toLowerCase().includes('back') || dispositivo.label.toLowerCase().includes('trasera')) {
                        opcion.selected = true;
                    }
                    selectorCamara.appendChild(opcion);
                });

                if (listaDispositivos.length > 1) {
                    selectorCamara.style.display = 'inline-block';
                }
            } catch (e) {
                console.error("Error enumerando cámaras:", e);
            }
        }

        async function arrancarCamara(deviceId = null) {
            if (flujoActual) {
                flujoActual.getTracks().forEach(track => track.stop());
            }

            const opcionesControles = deviceId 
                ? { video: { deviceId: { exact: deviceId } } }
                : { video: { facingMode: 'environment' } };

            try {
                flujoActual = await navigator.mediaDevices.getUserMedia(opcionesControles);
                video.srcObject = flujoActual;
