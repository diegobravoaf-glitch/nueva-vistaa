<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Escáner de Rondas</title>
    <!-- Librería oficial unificada para decodificar códigos QR -->
    <script src="https://unpkg.com" type="text/javascript"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #495057;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1em;
        }

        .btn-ingresar {
            width: 100%;
            padding: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            font-weight: bold;
            margin: 10px 0;
            box-sizing: border-box;
            display: block;
        }

        .btn-ingresar:hover { background-color: #0056b3; }
        .btn-clear { background-color: #6c757d; border: none; color: white; padding: 12px; width: 100%; font-weight: bold; border-radius: 8px; cursor: pointer; }

        .hidden { display: none !important; }

        #mensaje-error {
            color: #dc3545;
            font-weight: bold;
            margin-top: 12px;
            min-height: 20px;
        }

        .panel-header {
            text-align: center;
            border-bottom: 2px solid #f1f3f5;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .panel-header h1 { margin: 0 0 5px 0; font-size: 1.6em; }

        /* Contenedor del Lector dentro de la misma aplicación */
        #reader {
            width: 100%;
            margin: 15px 0;
            border-radius: 10px;
            overflow: hidden;
            border: none !important;
        }

        /* Estilos internos para limpiar los botones nativos de la librería */
        #reader button {
            padding: 10px 15px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }
        #reader button:hover { background-color: #218838; }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
            border-radius: 6px;
            border: 1px solid #dee2e6;
        }

        table { width: 100%; border-collapse: collapse; min-width: 300px; }
        th, td { padding: 12px 10px; text-align: left; font-size: 0.9em; border-bottom: 1px solid #dee2e6; }
        th { background-color: #f8f9fa; font-weight: 600; }
    </style>
</head>
<body>

    <!-- PANTALLA 1: FORMULARIO DE ACCESO -->
    <div id="pantalla-login" class="container">
        <h2>🔒 Acceso al Panel</h2>
        <p style="color: #6c757d; margin: 0 0 20px 0; font-size: 0.9em;">Ingresa las credenciales para iniciar tus rondas.</p>
        
        <div class="form-group">
            <label>Usuario</label>
            <input type="text" id="user" placeholder="diego" autocomplete="off" autocapitalize="off" autocorrect="off">
        </div>
        
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="pass" placeholder="12345" autocomplete="off" autocapitalize="off" autocorrect="off">
        </div>
        
        <button type="button" class="btn-ingresar" onclick="validarAccesoApp()">Entrar al Escáner</button>
        
        <div id="mensaje-error"></div>
    </div>

    <!-- PANTALLA 2: APLICATIVO DE ESCANEO DE RONDAS SECUENCIAL -->
    <div id="panel-secuencial" class="container hidden">
        <div class="panel-header">
            <h1>Escáner de Rondas</h1>
            <p style="margin:0; font-size:0.9em; color:#495057;">
                Operador: <span id="nombre-operador" style="font-weight: bold; color: #007bff;">DIEGO</span> • 
                <a href="#" onclick="cerrarSesion(); return false;" style="color: #dc3545; text-decoration: none; font-weight: bold;">Salir</a>
            </p>
        </div>

        <!-- AQUÍ ESTÁ EL LECTOR DENTRO DE LA APLICACIÓN QUE YA TE FUNCIONABA -->
        <div id="reader"></div>

        <h2 style="text-align: left; font-size: 1.2em; margin-top: 20px;">Historial de Registros</h2>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Hora</th>
                        <th>Contenido QR</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="historial-tbody">
                    <tr>
                        <td colspan="3" style="text-align: center; color: #888;">No hay registros de rondas aún</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <button type="button" class="btn-clear" style="margin-top: 15px;" onclick="reiniciarSecuencia()">Reiniciar Secuencia</button>
    </div>

    <script>
        let html5QrcodeScanner = null;

        function validarAccesoApp() {
            const usuarioIngresado = document.getElementById("user").value.trim().toLowerCase();
            const claveIngresada = document.getElementById("pass").value.trim();
            const errorBox = document.getElementById("mensaje-error");

            if (usuarioIngresado === "diego" && claveIngresada === "12345") {
                document.getElementById("pantalla-login").classList.add("hidden");
                document.getElementById("panel-secuencial").classList.remove("hidden");
                document.getElementById("nombre-operador").innerText = usuarioIngresado.toUpperCase();
                
                document.getElementById("user").value = "";
                document.getElementById("pass").value = "";
                errorBox.innerText = "";

                // Inicializamos el lector integrado dentro de la app justo después de entrar
                inicializarLectorRondas();
            } else {
                errorBox.innerText = "❌ Datos incorrectos de acceso";
            }
        }

        // --- INICIALIZACIÓN DEL LECTOR ORIGINAL DENTRO DE LA APP ---
        function inicializarLectorRondas() {
            if (!html5QrcodeScanner) {
                html5QrcodeScanner = new Html5QrcodeScanner(
                    "reader", 
                    { 
                        fps: 10, 
                        qrbox: { width: 250, height: 250 },
                        rememberLastUsedCamera: true
                    },
                    /* verbose= */ false
                );
                
                html5QrcodeScanner.render(onScanSuccess, onScanFailure);
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            // Registrar en el historial secuencial al detectar el QR con éxito
            registrarCodigoEnHistorial(decodedText);
            if (navigator.vibrate) navigator.vibrate(100);
        }

        function onScanFailure(error) {
            // Errores continuos de muestreo (se silencian para evitar spam)
        }

        function registrarCodigoEnHistorial(contenido) {
            const tbody = document.getElementById("historial-tbody");
            if(tbody.rows.length === 1 && tbody.rows.cells.length === 1) { tbody.innerHTML = ""; }
            const ahora = new Date();
            const horaString = ahora.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
            const nuevaFila = tbody.insertRow(0);
            nuevaFila.innerHTML = `<td>${horaString}</td><td><span style="word-break: break-all;">${contenido}</span></td><td style="color: green; font-weight:bold;">✓ Ok</td>`;
        }

        function reiniciarSecuencia() {
            if(confirm("¿Deseas limpiar el historial secuencial de rondas?")) {
                document.getElementById("historial-tbody").innerHTML = `<tr><td colspan="3" style="text-align: center; color: #888;">No hay registros de rondas aún</td></tr>`;
            }
        }

        function cerrarSesion() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.clear().then(() => {
                    html5QrcodeScanner = null;
                    restablecerYSalir();
                }).catch(() => {
                    restablecerYSalir();
                });
            } else {
                restablecerYSalir();
            }
        }

        function restablecerYSalir() {
            document.getElementById("panel-secuencial").classList.add("hidden");
            document.getElementById("pantalla-login").classList.remove("hidden");
        }
    </script>
</body>
</html>
