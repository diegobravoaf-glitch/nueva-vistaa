<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Escáner Secuencial</title>
    <!-- Librería oficial para decodificar códigos QR -->
    <script src="https://unpkg.com" type="text/javascript"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #212529;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hidden {
            display: none !important;
        }

        .auth-container {
            background: white;
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 100%;
            width: 100%;
            text-align: center;
            margin-top: 20px;
            box-sizing: border-box;
        }

        @media (min-width: 600px) {
            .auth-container, #panel-secuencial {
                max-width: 500px !important;
            }
        }

        .auth-container h2 {
            margin: 0 0 10px 0;
            font-size: 1.6em;
            color: #111;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.95em;
            color: #495057;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ced4da;
            border-radius: 10px;
            font-size: 1em;
            box-sizing: border-box;
            background-color: #fdfdfd;
        }

        #panel-secuencial {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            box-sizing: border-box;
        }

        .panel-header {
            text-align: center;
            border-bottom: 2px solid #f1f3f5;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .panel-header h1 {
            margin: 0 0 5px 0;
            font-size: 1.5em;
        }

        #reader-panel {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background-color: #000;
            margin: 15px 0;
        }

        .status-box {
            background: #e9ecef;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 1em;
            margin-bottom: 15px;
        }

        .loading-text {
            color: #fd7e14;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 300px;
        }

        th, td {
            padding: 12px 10px;
            text-align: left;
            font-size: 0.9em;
            border-bottom: 1px solid #dee2e6;
        }

        th {
            background-color: #f8f9fa;
            font-weight: 600;
        }

        .btn-input {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 15px 0;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            background-color: #007bff;
            color: white;
            box-sizing: border-box;
            -webkit-appearance: none;
        }

        .btn-cam-on { background-color: #28a745; color: white; }
        .btn-cam-off { background-color: #dc3545; color: white; }
        .btn-clear { background-color: #6c757d; color: white; }

        .status-message {
            font-weight: bold;
            margin-top: 12px;
            font-size: 0.95em;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE INICIO DE SESIÓN DIRECTO -->
    <div id="login-container" class="auth-container">
        <h2>🔒 Acceso al Panel</h2>
        <p style="color: #6c757d; margin: 0 0 20px 0; font-size: 0.9em;">Ingresa tu nombre y la contraseña maestra.</p>
        
        <div class="form-group">
            <label>Nombre de Usuario</label>
            <input type="text" id="login-username" placeholder="Escribe tu nombre" autocomplete="off" autocapitalize="off" autocorrect="off">
        </div>
        
        <div class="form-group">
            <label>Contraseña Autorizada</label>
            <input type="password" id="login-password" placeholder="Clave maestra" autocomplete="off" autocapitalize="off" autocorrect="off">
        </div>

        <button type="button" class="btn-input" onclick="procesarLogin()">Ingresar al Escáner</button>
        
        <div id="login-msg" class="status-message"></div>
    </div>

    <!-- PANEL DE ESCANEO SECUENCIAL -->
    <div id="panel-secuencial" class="hidden">
        <div class="panel-header">
            <h1>Escáner Secuencial</h1>
            <p style="margin:0; font-size:0.9em; color:#495057;">
                Operador: <span id="nombre-operador" style="font-weight: bold; color: #007bff;">Usuario</span> • 
                <a href="#" onclick="cerrarSesion(); return false;" style="color: #dc3545; text-decoration: none; font-weight: bold;">Salir</a>
            </p>
        </div>

        <div class="status-box">
            Estado: <span id="panel-state-text" class="loading-text">QR en Espera / CARGANDO...</span>
        </div>

        <button type="button" id="btn-toggle-cam" class="btn-input btn-cam-on" onclick="encenderCamaraPanel()">Encender Cámara</button>

        <div id="reader-panel"></div>

        <h2>Historial de Registros</h2>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Hora</th>
                        <th>Contenido QR</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="historial-tbody">
                    <tr>
                        <td colspan="3" style="text-align: center; color: #888;">No hay registros aún</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <button type="button" class="btn-input btn-clear" style="margin-top: 15px;" onclick="reiniciarSecuencia()">Reiniciar Secuencia</button>
    </div>

    <script>
        let panelScanner = null;
        const USUARIO_VALIDO = "diego";
        const CLAVE_MAESTRA = "diego12345"; 

        function procesarLogin() {
            const usuario = document.getElementById("login-username").value.trim().toLowerCase();
            const clave = document.getElementById("login-password").value.trim().toLowerCase();
            const msgBox = document.getElementById("login-msg");

            if (!usuario || !clave) {
                msgBox.style.color = "#dc3545";
                msgBox.innerText = "❌ Por favor completa ambos campos.";
                return;
            }

            if (usuario === USUARIO_VALIDO && clave === CLAVE_MAESTRA) {
                msgBox.style.color = "#28a745";
                msgBox.innerText = "✓ Credenciales correctas. Abriendo panel...";

                document.getElementById("nombre-operador").innerText = usuario.toUpperCase();
                
                document.getElementById("login-container").classList.add("hidden");
                document.getElementById("panel-secuencial").classList.remove("hidden");
                
                document.getElementById("login-username").value = "";
                document.getElementById("login-password").value = "";
                msgBox.innerText = "";
            } else {
                msgBox.style.color = "#dc3545";
                msgBox.innerText = "❌ Usuario o contraseña incorrectos.";
            }
        }

        function encenderCamaraPanel() {
            const btn = document.getElementById("btn-toggle-cam");
            
            if (panelScanner && panelScanner.isScanning) {
                panelScanner.stop().then(() => {
                    btn.innerText = "Encender Cámara";
                    btn.className = "btn-input btn-cam-on";
                    document.getElementById("panel-state-text").innerText = "Escáner Pausado";
                    document.getElementById("panel-state-text").className = "";
                });
                return;
            }

            if (!panelScanner) {
                panelScanner = new Html5Qrcode("reader-panel");
            }

            const config = { fps: 12, qrbox: { width: 260, height: 260 } };

            panelScanner.start(
                { facingMode: "environment" }, 
                config, 
                (decodedText) => {
                    registrarCodigoEnHistorial(decodedText);
                    if (navigator.vibrate) navigator.vibrate(100);
                }, 
                (err) => { }
            ).then(() => {
                btn.innerText = "Apagar Cámara";
                btn.className = "btn-input btn-cam-off";
                document.getElementById("panel-state-text").innerText = "⚙️ ESCANEANDO SECUENCIALMENTE...";
