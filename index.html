<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector QR Secuencial Alfanumérico</title>
    <!-- Motor universal compatible con todos los móviles -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 15px;
            text-align: center;
            background-color: #f8f9fa;
            color: #212529;
        }
        #camara-contenedor {
            width: 100%;
            max-width: 360px;
            aspect-ratio: 1 / 1;
            margin: 15px auto;
            border: 3px solid #0d6efd;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        canvas {
            display: none;
        }
        .info-secuencia {
            font-size: 1.2rem;
            margin: 10px 0;
            background: #e7f1ff;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #b6d4fe;
        }
        #texto-esperado {
            color: #0d6efd;
            font-weight: bold;
            display: block;
            font-size: 1.5rem;
            margin-top: 5px;
            word-break: break-all;
        }
        .controles {
            margin: 15px 0;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        button {
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            flex: 1;
            max-width: 200px;
        }
        button.btn-peligro { background-color: #dc3545; max-width: 100%; }
        select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            flex: 1;
            max-width: 150px;
        }
        .tabla-responsiva {
            width: 100%;
            overflow-x: auto;
            margin-top: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-size: 0.95rem;
        }
        th, td {
            padding: 10px;
            border-bottom: 1px solid #dee2e6;
            text-align: center;
        }
        th { background-color: #212529; color: white; }
        td { word-break: break-all; }
        .valido { color: #198754; font-weight: bold; }
        .invalido { color: #dc3545; font-weight: bold; }
        .completado { color: #6c757d; font-style: italic; }
    </style>
</head>
<body>

    <h1>Escáner Secuencial</h1>
    
    <div class="info-secuencia">
        Siguiente QR esperado:
        <span id="texto-esperado">INICIANDO...</span>
    </div>

    <div class="controles">
        <button id="btn-iniciar">Encender Cámara</button>
        <select id="selector-camara" style="display:none;"></select>
    </div>

    <div id="camara-contenedor">
        <video id="video-feed" autoplay playsinline muted></video>
        <canvas id="canvas-procesador"></canvas>
    </div>

    <h2>Historial de Registros</h2>
    <div class="tabla-responsiva">
        <table>
            <thead>
                <tr>
                    <th>Hora</th>
                    <th>Contenido QR</th>
                    <th>Resultado</th>
                </tr>
            </thead>
            <tbody id="tabla-historial"></tbody>
        </table>
    </div>

    <button id="btn-reiniciar" class="btn-peligro">Reiniciar Secuencia</button>

    <script>
        const secuenciaEsperada = [
            "QR-ZONA-A",
            "PRODUCTO-504",
            "MESA-CHECK-02",
            "FIN-RUTA"
        ];

        let indiceActual = 0;
        let flujoActual = null;
        let listaDispositivos = [];

        const video = document.getElementById('video-feed');
        const canvas = document.getElementById('canvas-procesador');
        const ctx = canvas.getContext('2d');
        const btnIniciar = document.getElementById('btn-iniciar');
        const selectorCamara = document.getElementById('selector-camara');
        const txtEsperado = document.getElementById('texto-esperado');
        const tablaHistorial = document.getElementById('tabla-historial');
        const btnReiniciar = document.getElementById('btn-reiniciar');

        actualizarInterfazEsperada();

        function actualizarInterfazEsperada() {
            if (indiceActual < secuenciaEsperada.length) {
                txtEsperado.innerText = secuenciaEsperada[indiceActual];
                txtEsperado.className = "";
            } else {
                txtEsperado.innerText = "¡Secuencia Completada! 🎉";
                txtEsperado.className = "completado";
            }
        }

        async function obtenerCamaras() {
            try {
                const dispositivos = await navigator.mediaDevices.enumerateDevices();
                listaDispositivos = dispositivos.filter(d => d.kind === 'videoinput');
                
                selectorCamara.innerHTML = '';
                listaDispositivos.forEach((dispositivo, index) => {
                    const opcion = document.createElement('option');
                    opcion.value = dispositivo.deviceId;
                    opcion.text = dispositivo.label || `Cámara ${index + 1}`;
                    if (dispositivo.label.toLowerCase().includes('back') || dispositivo.label.toLowerCase().includes('trasera')) {
                        opcion.selected = true;
                    }
                    selectorCamara.appendChild(opcion);
                });

                if (listaDispositivos.length > 1) {
                    selectorCamara.style.display = 'inline-block';
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function arrancarCamara(deviceId = null) {
            if (flujoActual) {
                flujoActual.getTracks().forEach(track => track.stop());
            }

            const opcionesControles = deviceId 
                ? { video: { deviceId: { exact: deviceId } } }
                : { video: { facingMode: 'environment' } };

            try {
                flujoActual = await navigator.mediaDevices.getUserMedia(opcionesControles);
                video.srcObject = flujoActual;
                btnIniciar.style.display = 'none';
                await obtenerCamaras();
                requestAnimationFrame(escanearFotograma);
            } catch (err) {
                alert("Error de acceso a la cámara. Revisa los permisos de tu navegador.");
            }
        }

        let ultimoCodigoLeido = null;
        let tiempoUltimoEscaneo = 0;

        function escanearFotograma() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.height = video.videoHeight;
                canvas.width = video.videoWidth;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const codigo = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: "dontInvert",
                });

                if (codigo) {
                    procesarQR(codigo.data);
                }
            }
            requestAnimationFrame(escanearFotograma);
        }

        function procesarQR(textoQR) {
            const ahoraTiempo = Date.now();
            if (textoQR === ultimoCodigoLeido && (ahoraTiempo - tiempoUltimoEscaneo) < 2500) return;

            ultimoCodigoLeido = textoQR;
            tiempoUltimoEscaneo = ahoraTiempo;

            const ahora = new Date();
            const horaFormateada = ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            let resultadoTexto = "";
            let claseResultado = "";

            if (indiceActual >= secuenciaEsperada.length) return;

            if (textoQR.trim() === secuenciaEsperada[indiceActual].trim()) {
                resultadoTexto = "Válido";
                claseResultado = "valido";
                indiceActual++;
                actualizarInterfazEsperada();
            } else {
                resultadoTexto = "Incorrecto (Fuera de secuencia)";
                claseResultado = "invalido";
            }

            const nuevaFila = document.createElement('tr');
            nuevaFila.innerHTML = `
                <td>${horaFormateada}</td>
                <td><strong>${textoQR}</strong></td>
                <td class="${claseResultado}">${resultadoTexto}</td>
            `;
            tablaHistorial.insertBefore(nuevaFila, tablaHistorial.firstChild);
        }

        btnIniciar.addEventListener('click', () => arrancarCamara(selectorCamara.value));
        selectorCamara.addEventListener('change', () => arrancarCamara(selectorCamara.value));
        
        btnReiniciar.addEventListener('click', () => {
            indiceActual = 0;
            actualizarInterfazEsperada();
            tablaHistorial.innerHTML = '';
            ultimoCodigoLeido = null;
        });
    </script>
</body>
</html>
