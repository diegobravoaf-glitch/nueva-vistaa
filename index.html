<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector QR Secuencial de Seguridad</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #111827; /* Fondo oscuro */
            color: #f3f4f6;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .subtitulo {
            font-size: 0.9rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        h1::after {
            content: "🛡️"; /* Icono de escudo de seguridad */
            font-size: 1.4rem;
        }
        .info-secuencia {
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: 500;
        }
        #texto-esperado {
            background-color: #1d4ed8;
            color: white;
            padding: 4px 12px;
            border-radius: 6px;
            font-weight: bold;
            margin-left: 5px;
            display: inline-block;
        }
        .controles {
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }
        #btn-iniciar {
            background: transparent;
            color: #ffffff;
            border: 1px solid #4b5563;
            padding: 10px 24px;
            font-size: 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }
        #btn-iniciar::before {
            content: "📷";
        }
        #btn-iniciar:hover {
            background-color: #1f2937;
            border-color: #9ca3af;
        }
        #selector-camara {
            background-color: #1f2937;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #374151;
            width: 100%;
            max-width: 250px;
        }

        /* 📸 CONTENEDOR DE LA CÁMARA ESTILO ESCÁNER MÓVIL */
        .visor-camara-wrapper {
            position: relative;
            width: 100%;
            max-width: 340px;
            aspect-ratio: 1 / 1;
            margin-bottom: 10px;
        }
        #camara-contenedor {
            width: 100%;
            height: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #090d16;
            position: relative;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        /* Esquinas de enfoque del escáner */
        .esquina-enfoque {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 4px solid #38bdf8;
            z-index: 10;
            pointer-events: none;
        }
        .top-left { top: 20px; left: 20px; border-right: none; border-bottom: none; border-top-left-radius: 8px; }
        .top-right { top: 20px; right: 20px; border-left: none; border-bottom: none; border-top-right-radius: 8px; }
        .bottom-left { bottom: 20px; left: 20px; border-right: none; border-top: none; border-bottom-left-radius: 8px; }
        .bottom-right { bottom: 20px; right: 20px; border-left: none; border-top: none; border-bottom-right-radius: 8px; }
        
        /* Línea láser de escaneo animada */
        .linea-laser {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #38bdf8, transparent);
            box-shadow: 0 0 10px #38bdf8;
            z-index: 9;
            animation: escanearMovimiento 2s linear infinite;
            pointer-events: none;
        }
        @keyframes escanearMovimiento {
            0% { top: 20px; }
            50% { top: calc(100% - 23px); }
            100% { top: 20px; }
        }

        .texto-ayuda {
            font-size: 0.85rem;
            color: #6b7280;
            margin-bottom: 25px;
        }

        h2 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 15px;
            align-self: flex-start;
            max-width: 400px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
            text-align: left;
        }

        /* 📊 TABLA ESTILO OSCURO PROFESIONAL */
        .tabla-responsiva {
            width: 100%;
            max-width: 400px;
            overflow-x: auto;
            margin-bottom: 30px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1f2937;
            border-radius: 12px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 10px;
            text-align: center;
            font-size: 0.9rem;
            border-bottom: 1px solid #374151;
        }
        th {
            background-color: #111827;
            color: #9ca3af;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .icono-qr {
            font-size: 1.1rem;
        }
        .valido { color: #ffffff; }
        .invalido { color: #ef4444; }
        
        /* Estados visuales check / alerta */
        .estado-check::after { content: "✔️"; color: #10b981; font-weight: bold; }
        .estado-alerta::after { content: "⚠️"; color: #f59e0b; }

        .btn-texto-reiniciar {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 15px;
            text-decoration: none;
        }
        .btn-texto-reiniciar:hover {
            color: #ffffff;
        }

        .btn-peligro-rojo {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            max-width: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-peligro-rojo::before {
            content: "⚠️";
        }
        .btn-peligro-rojo:hover {
            background-color: #b91c1c;
        }
        .completado {
            background-color: #10b981 !important;
        }
    </style>
</head>
<body>

    <p class="subtitulo">Escáner QR en Tiempo Real</p>
    <h1>Lector QR Secuencial de Seguridad</h1>
    
    <div class="info-secuencia">
        Siguiente esperado: <span id="texto-esperado">CARGANDO...</span>
    </div>

    <div class="controles">
        <button id="btn-iniciar">Encender Cámara</button>
        <select id="selector-camara" style="display:none;"></select>
    </div>

    <!-- Visor con estilo de mira de escaneo -->
    <div class="visor-camara-wrapper">
        <div class="esquina-enfoque top-left"></div>
        <div class="esquina-enfoque top-right"></div>
        <div class="esquina-enfoque bottom-left"></div>
        <div class="esquina-enfoque bottom-right"></div>
        <div class="linea-laser"></div>
        
        <div id="camara-contenedor">
            <video id="video-feed" autoplay playsinline muted></video>
        </div>
    </div>
    <p class="txt-ayuda">Zonas de Escaneo Óptimas</p>

    <h2>Historial de Registros</h2>
    <div class="tabla-responsiva">
        <table>
            <thead>
                <tr>
                    <th>Hora</th>
                    <th>QR ID</th>
                    <th>Resultado</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="tabla-historial">
                <!-- Los registros se inyectarán aquí -->
            </tbody>
        </table>
    </div>

    <button id="btn-texto-limpiar" class="btn-texto-reiniciar">Reiniciar Todo</button>
    <button id="btn-reiniciar" class="btn-peligro-rojo">Reiniciar Sesión y Registros</button>
